name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate notes, strip Codebuff footer, publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Uses .github/release.yml (exclude rules) to build the notes
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body > notes.md

          # Same effect as your original regex replacement
          sed -i -E 's/🤖 Generated with Codebuff.*//' notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md
