name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures build together so one latest-mac yml lists
          # every zip the updater can choose from
          - os: macos-latest
            label: macOS arm64 and x64
            args: --mac --arm64 --x64
          - os: windows-latest
            label: Windows x64
            args: --win --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build main and renderer
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      # A DMG that fails to mount is useless, and the failure only shows up on
      # the user's Mac, so mount every image here and stop the release instead.
      - name: Verify macOS images
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release/*.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "electron-builder produced no DMG"
            exit 1
          fi
          for image in "${images[@]}"; do
            hdiutil verify "$image"
            mountpoint=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$image"
            test -d "$mountpoint/Side A.app"
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint"
            echo "mounted and verified $image"
          done

      # electron-updater reads these files from the release, so a missing one
      # silently disables updates instead of failing the build here
      - name: Verify update metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata=(release/*.yml)
          if [ ${#metadata[@]} -eq 0 ]; then
            echo "electron-builder produced no update metadata"
            exit 1
          fi
          ls -lh release/*.yml release/*.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node reads the changelog directly, the release job installs nothing
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if node scripts/release-notes.mjs; then
            cat notes.md
            exit 0
          fi
          echo "No changelog entry for $TAG, using commit subjects"
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## What's new"
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty='- %s' "$PREVIOUS..$TAG"
            else
              git log --no-merges --pretty='- %s' "$TAG"
            fi
          } | sed -E '/Generated with Codebuff/d' > notes.md
          cat notes.md

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Drafted first and published at the very end: a release page that exists
      # while its 128 MB assets are still uploading hands anyone who clicks a
      # half-written file, which macOS reports as a corrupted disk image.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh artifacts
          gh release create "$TAG" \
            --draft \
            --title "Side A $TAG" \
            --notes-file notes.md

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

      # Read every asset back from GitHub and compare it with the file the build
      # job verified, so a truncated upload fails here instead of on a user's Mac.
      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p published
          (cd published && gh release download "$TAG" --clobber)
          for asset in artifacts/*; do
            name=$(basename "$asset")
            # GitHub rewrites spaces in uploaded asset names to dots.
            cmp "$asset" "published/${name// /.}"
            echo "intact: $name"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
